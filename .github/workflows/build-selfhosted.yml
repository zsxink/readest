name: Build Self-Hosted Clients

on:
  push:
    tags:
      - 'xv*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            release: android
            rust_target: aarch64-linux-android
          - os: macos-latest
            release: macos
            arch: aarch64
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            release: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            args: '--bundles nsis'

    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.ANON_KEY }}
      NEXT_PUBLIC_APP_PLATFORM: tauri
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
      NEXT_PUBLIC_DISABLE_UPDATER: 'true'
      READEST_DISABLE_UPDATER: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: setup Java (Android only)
        if: matrix.config.release == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK (Android only)
        if: matrix.config.release == 'android'
        uses: android-actions/setup-android@v4

      - name: install NDK (Android only)
        if: matrix.config.release == 'android'
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy vendor assets to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.release }}-cargo

      - name: install system dependencies (Linux desktop only)
        if: matrix.config.os == 'ubuntu-22.04' || (matrix.config.os == 'ubuntu-latest' && matrix.config.release != 'android')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: disable updater artifacts (self-hosted builds don't use signing)
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/readest-app/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            console.log('Patched createUpdaterArtifacts -> false');
          "

      - name: initialize Android project files
        if: matrix.config.release == 'android'
        shell: bash
        run: |
          pnpm tauri android init
          # ic_launcher.xml references @color/ic_launcher_background but init
          # doesn't generate colors.xml. Create it to avoid AAPT build failure.
          mkdir -p src-tauri/gen/android/app/src/main/res/values
          cat > src-tauri/gen/android/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          EOF
        working-directory: apps/readest-app

      - name: configure Android release signing
        if: matrix.config.release == 'android'
        shell: bash
        run: |
          cd apps/readest-app/src-tauri/gen/android
          {
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
          } > keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"

      - name: build Android APK
        if: matrix.config.release == 'android'
        shell: bash
        run: |
          cd apps/readest-app/
          version=${{ github.ref_name }}
          pnpm tauri android build --target aarch64 --split-per-abi
          apk=src-tauri/gen/android/app/build/outputs/apk/arm64-v8a/release/app-arm64-v8a-release.apk
          cp "$apk" "Readest_${version}_arm64.apk"
          echo "Copied $apk -> Readest_${version}_arm64.apk"

      - name: build desktop bundle (macOS / Windows)
        if: matrix.config.release != 'android'
        shell: bash
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          cd apps/readest-app/
          pnpm tauri build ${{ matrix.config.args }}

      - name: upload Android APK
        if: matrix.config.release == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: readest-android-${{ github.ref_name }}
          path: apps/readest-app/Readest_${{ github.ref_name }}_arm64.apk

      - name: upload macOS DMG
        if: matrix.config.release == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: readest-macos-${{ github.ref_name }}
          path: target/release/bundle/dmg/*.dmg

      - name: upload Windows installer
        if: matrix.config.release == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: readest-windows-${{ github.ref_name }}
          path: target/release/bundle/nsis/*.exe
